<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batchs Management</title>
    <link rel="stylesheet" href="batches.css">
</head>
<body>
    <h3>Batches Management</h3>
    <form id="batches">
        <div class="zoro">
            <label for="Search">Search:</label>
            <input type="text" id="Search" placeholder="Search Batches or Medicine"><br>
        </div>
        <div class="zoro">
        <label for="Medicine">Medicine:</label>
        <select id="Medicine">
        <option value="All">All</option>
        <option value="All">All</option>
        </select><br>
        </div>
        <div class="zoro">
        <label for="Expiry">Expiry:</label>
        <select id="Expiry">
            <option value="All">All</option>
            <option value="All">All</option>
        </select>
        </div>
        </form>
    <table border="6" id="user_id">
        <th>ID</th>
        <th>Medicine</th>
        <th>Batch</th>
        <th>Mfg Date</th>
        <th>Expiry</th>
        <th>Quantity</th>
    </table>
    
</body>
</html>
