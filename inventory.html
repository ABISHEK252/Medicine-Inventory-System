<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="inventory.css">
</head>
<body>
    <h3>Inventory</h3>
    <form id="inventory">
        <div class="zoro">
        <label for="Search">Search:</label>
        <input type="text" id="Search"><br>
        </div>
        <div class="zoro">
        <label for="Category">Category:</label>
        <select id="Category">
            <option value="All">All</option>
            <option value="All">All</option>
        </select><br>
        </div>
        <div class="zoro">
        <label for="Status">Status:</label>
        <select id="Status">
        <option value="All">All</option>
        <option value="All">All</option>
        </select><br>
        </div>

    </form>
    <table border="6" id="user_id">
        <th>Medicine</th>
        <th>Batch</th>
        <th>Quantity</th>
        <th>Reorder Level</th>
        <th>Status</th>

    </table>
</body>
</html>
