<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Medicine Form </title>
    <link rel="stylesheet" href="Medicine.css">
    
</head>

<body>
    <h3>Medicine Form</h3>

    <form id="medicine">
        <div class="Abi">
            <label for="Medicine Form">Medicine Name :</label>
            <input type="text" id="Medicine Name" placeholder="medicine name" required><br>
        </div>
        <div class="Abi">
            <label for="Generic Name">Generic Name :</label>
            <input type="text" id="Generic "><br>
        </div>
        <div class="Abi">
            <label for="Category">Category :</label>
            <input type="text" id="Category"><br>
        </div>
        <div class="Abi">
            <label for="Manufacturer">Manufacturer :</label>
            <input type="text" id="Manufacturer"><br>
        </div>
        <div class="Abi">
            <label for="Dosage Form">Dosage Form :</label>
            <input type="text" id="Dosage Form"><br>
        </div>
        <div class="Abi">
            <label for="Strength">Strength :</label>
            <input type="text" id="Strength"><br>
        </div>
        <div class="Abi">
            <label for="Preorder Level">Preorder Level :</label>
            <input type="number"><br>
        </div>
        <div class="Abi">
            <label for="Description">Description :</label>
            <textarea   placeholder="Enter the Description"></textarea><br>
        </div>
        <div class="Abi">
            <label for="Search">Search:</label>
            <input type="text" id="Search">
        </div>


        <button type="submit">Add Medicine </button>





    </form><br>
    <table border="6" id="user_id">
        <tr>
            <th>ID</th>
            <th>Medicine</th>
            <th>Category</th>
            <th>Strength</th>
            <th>Actions</th>
        </tr><br>
    </table>

</body>

</html>
