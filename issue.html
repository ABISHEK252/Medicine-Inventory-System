<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Issue</title>
    <link rel="stylesheet" href="issue.css">
</head>
<body>
    <h3>Medicine Issue</h3>
    <form id="issue">
        <div class="zoro">

        <label for="Medicine">Medicine :</label>
        <input type="text" id="Medicine" placeholder="Paracetamol"><br>
        
        </div>
        <div class="zoro">

            <label for="Batch">Batch:</label>
            <input type="number" id="Medicine"><br>

        </div>
        <div class="zoro">

            <label for="Available">Available :</label>
            <input type="number" id="Available"><br>

        </div>
        <div class="zoro">

            <label for="Issue Qty">Issue Qty :</label>
            <input type="number" id="Issue Qty"><br>

        </div>
        <div class="zoro">

            <label for="Customer">Customer :</label>
            <input type="text" id="Customer"><br>

        </div>
        <div class="zoro">

            <label for="Issue Date">Issue Date :</label>
            <input type="date" id="zoro"><br>

        </div>
        <div class="zoro">

            <label for="Remarks">Remarks :</label>
            <input type="number" id="Remarks"><br>

        </div>
        <button type="Issue Medicine">Issue Medicine</button>
    <table border="6" id="user_id">
        <th>Id</th>
        <th>Medicine</th>
        <th>Batch</th>
        <th>Quantity</th>
        <th>Date</th>
    </table><br>
    </form>
</body>
</html>
